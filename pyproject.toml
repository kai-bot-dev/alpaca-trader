[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpaca-trader"
version = "0.1.0"
description = "Alpaca options paper trading system with CLI and FastAPI backend"
requires-python = ">=3.9"
dependencies = [
    "alpaca-py>=0.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer[all]>=0.13.0",
    # pandas-ta added in Sprint 2 (strategy engine) - requires Python 3.12+
    # "pandas-ta>=0.3.14b",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "websockets>=13.0",
    "pytz>=2024.1",
]

[project.scripts]
alpaca-trader = "alpaca_trader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_trader"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=2.2.2.240807",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.8",
    "types-requests>=2.32.4.20260107",
]
